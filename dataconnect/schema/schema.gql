# ------------------------------------------------------------
# Votes V0.9 — reusable definitions and session ballots
# ------------------------------------------------------------

type VoteDefinition @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  title: String!
  question: String!
  scopeType: String!
  scopeRef: String
  choicesMode: String!
  secret: Boolean! @default(value: true)
  votesPerElector: Int! @default(value: 1)
  weighted: Boolean! @default(value: false)
  weightResourceExternalId: String
  abstention: Boolean! @default(value: false)
  modifiable: Boolean! @default(value: false)
  closeMode: String!
  durationMinutes: Int
  resultVisibility: String!
  tieRule: String
  notificationOpenExternalId: String
  notificationResultExternalId: String
  active: Boolean! @default(value: true)
}

type VoteOptionDefinition @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  voteExternalId: String!
  orderIndex: Int!
  label: String!
  description: String
  characterExternalId: String
  enabledConditionExternalId: String
  active: Boolean! @default(value: true)
}

# ------------------------------------------------------------
# Pre-casting / registrations before a session exists
# ------------------------------------------------------------

type PrecastCampaign @table {
  organization: Organization!
  scenario: Scenario!
  name: String!
  token: String! @unique
  language: String! @default(value: "FR")
  status: String! @default(value: "OPEN")
  plannedAt: Timestamp
  venueHint: String
  publicNote: String
  openCount: Int! @default(value: 0)
  submissionCount: Int! @default(value: 0)
  lastOpenedAt: Timestamp
  closedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

type PrecastRegistration @table {
  campaign: PrecastCampaign!
  displayName: String!
  email: String!
  ageBracket: String!
  genderPreference: String
  desiredInvolvement: String!
  notes: String
  status: String! @default(value: "REGISTERED")
  transferredSessionId: String
  submittedAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  active: Boolean! @default(value: true)
}

# ------------------------------------------------------------
# Runtime anchor. Runtime tables will be expanded after importer.
# ------------------------------------------------------------

type GameSession @table {
  organization: Organization!
  scenarioVersion: ScenarioVersion!
  name: String
  scheduledAt: Timestamp
  venue: String
  language: String!
  status: String! @default(value: "DRAFT")
  notes: String
  precastEnabled: Boolean! @default(value: false)
  precastToken: String
  precastOpenCount: Int! @default(value: 0)
  precastLastOpenedAt: Timestamp
  precastSubmissionCount: Int! @default(value: 0)
  runtimeInitializedAt: Timestamp
  runtimeVersion: String
  startedAt: Timestamp
  pausedAt: Timestamp
  finishedAt: Timestamp
  liveClockStartedAt: Timestamp
  liveElapsedSeconds: Int! @default(value: 0)
  currentPhaseExternalId: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type SessionParticipant @table {
  gameSession: GameSession!
  displayName: String!
  email: String
  ageBracket: String
  genderPreference: String
  desiredInvolvement: String
  characterExternalId: String
  # Incarnation propre à une session
  characterDisplayName: String
  characterGenderVariant: String
  characterSnapshotJson: String
  characterSnapshotAt: Timestamp
  castingLocked: Boolean! @default(value: false)
  briefingStatus: String! @default(value: "NOT_SENT")
  playerAccessToken: String
  playerAccessEnabled: Boolean! @default(value: false)
  playerFirstOpenedAt: Timestamp
  playerLastOpenedAt: Timestamp
  playerOpenCount: Int! @default(value: 0)
  briefingReadAt: Timestamp
  # Private notebook: participant-owned, never included in scenario/GM exports.
  privateNotesJson: String
  privateNotesRevision: Int! @default(value: 0)
  source: String! @default(value: "MANUAL")
  precastSubmittedAt: Timestamp
  notes: String
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ------------------------------------------------------------
# Runtime snapshot V0.6 — session-specific live state
# ------------------------------------------------------------

type SessionCharacter @table(key: ["gameSession", "characterExternalId"]) {
  gameSession: GameSession!
  participant: SessionParticipant!
  characterExternalId: String!
  status: String! @default(value: "READY")
  active: Boolean! @default(value: true)
  initializedAt: Timestamp! @default(expr: "request.time")
}

type SessionResource @table(key: ["gameSession", "characterExternalId", "resourceExternalId"]) {
  gameSession: GameSession!
  characterExternalId: String!
  resourceExternalId: String!
  initialValue: Int!
  currentValue: Int!
  maxValue: Int
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SessionKnowledge @table(key: ["gameSession", "characterExternalId", "factExternalId"]) {
  gameSession: GameSession!
  characterExternalId: String!
  factExternalId: String!
  sourceType: String! @default(value: "INITIAL")
  learnedAt: Timestamp! @default(expr: "request.time")
}

type SessionObjective @table(key: ["gameSession", "characterExternalId", "objectiveExternalId"]) {
  gameSession: GameSession!
  characterExternalId: String!
  objectiveExternalId: String!
  status: String!
  progress: Int
  notes: String
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SessionObject @table(key: ["gameSession", "objectExternalId"]) {
  gameSession: GameSession!
  objectExternalId: String!
  holderType: String!
  holderExternalId: String
  charges: Int
  identificationLevel: Int! @default(value: 0)
  inPlay: Boolean! @default(value: true)
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SessionCharacterState @table(key: ["gameSession", "characterExternalId", "stateExternalId"]) {
  gameSession: GameSession!
  characterExternalId: String!
  stateExternalId: String!
  active: Boolean! @default(value: true)
  appliedAt: Timestamp! @default(expr: "request.time")
  expiresAt: Timestamp
  sourceRef: String
}

# ------------------------------------------------------------
# Interactions V0.8 — actions, discoveries and object movement
# ------------------------------------------------------------

type SessionInteractionUse @table {
  gameSession: GameSession!
  interactionExternalId: String!
  actorCharacterExternalId: String!
  targetType: String!
  targetExternalId: String
  resolution: String!
  success: Boolean
  abilityLevel: Int! @default(value: 0)
  actorRollJson: String
  targetRollJson: String
  costResourceExternalId: String
  costValue: Int
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ------------------------------------------------------------
# Clandestine interactions V1.3 — one-shot theft grants
# ------------------------------------------------------------

type SessionStealGrant @table(key: ["gameSession", "grantToken"]) {
  gameSession: GameSession!
  grantToken: String!
  interactionExternalId: String!
  actorCharacterExternalId: String!
  targetCharacterExternalId: String!
  kind: String! @default(value: "STEAL")
  status: String! @default(value: "OPEN")
  createdAt: Timestamp! @default(expr: "request.time")
  expiresAt: Timestamp!
  usedAt: Timestamp
  chosenObjectExternalId: String
}

type SessionClueDiscovery @table(key: ["gameSession", "characterExternalId", "clueExternalId"]) {
  gameSession: GameSession!
  characterExternalId: String!
  clueExternalId: String!
  sourceInteractionExternalId: String
  sourceRef: String
  discoveredAt: Timestamp! @default(expr: "request.time")
}

# ------------------------------------------------------------
# Live MJ V0.9 — timeline and audit
# ------------------------------------------------------------

type SessionEvent @table(key: ["gameSession", "eventExternalId"]) {
  gameSession: GameSession!
  eventExternalId: String!
  status: String! @default(value: "PENDING")
  firedAt: Timestamp
  acknowledgedAt: Timestamp
  skippedAt: Timestamp
  notes: String
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SessionActionLog @table {
  gameSession: GameSession!
  actionType: String!
  characterExternalId: String
  refExternalId: String
  beforeValue: String
  afterValue: String
  deltaValue: Int
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
}



# ------------------------------------------------------------
# Vote runtime V0.9
# ------------------------------------------------------------

type SessionVote @table(key: ["gameSession", "voteExternalId", "round"]) {
  gameSession: GameSession!
  voteExternalId: String!
  round: Int!
  status: String! @default(value: "OPEN")
  eligibleOptionExternalIds: String
  openedAt: Timestamp! @default(expr: "request.time")
  closedAt: Timestamp
  resultJson: String
  note: String
}

type SessionBallot @table(key: ["gameSession", "voteExternalId", "round", "electorCharacterExternalId"]) {
  gameSession: GameSession!
  voteExternalId: String!
  round: Int!
  electorCharacterExternalId: String!
  selectedOptionExternalIds: String
  weight: Int! @default(value: 1)
  castAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ------------------------------------------------------------
# Player portal V1.0 — player-safe notifications
# ------------------------------------------------------------

type SessionPlayerNotification @table {
  gameSession: GameSession!
  characterExternalId: String!
  kind: String!
  title: String!
  body: String!
  priority: String! @default(value: "NORMAL")
  refExternalId: String
  createdAt: Timestamp! @default(expr: "request.time")
  readAt: Timestamp
}


type Ability @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  name: String!
  description: String!
  category: String!
  defaultLevel: Int! @default(value: 0)
  defaultMaxUses: Int
  defaultCooldownMinutes: Int
  secret: Boolean! @default(value: false)
  active: Boolean! @default(value: true)
}

type AbilityAssignment @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  ownerType: String!
  ownerExternalId: String!

# Murder Engine — V1.4 · scenario families & immutable variants
# Firebase SQL Connect / PostgreSQL

# ------------------------------------------------------------
# Tenant + scenario versioning
# ------------------------------------------------------------

type Organization @table {
  name: String!
  slug: String! @unique
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

type Scenario @table {
  organization: Organization!
  title: String!
  slug: String!

  # Skin Engine V1.10 — apparence commune à la famille de scénario
  skinId: String
  accentColor: String

  archived: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ScenarioVersion @table {
  scenario: Scenario!
  sourceScenarioId: String!
  versionLabel: String!
  variantName: String
  genderProfile: String
  variantNotes: String
  templateVersion: String!
  language: String!
  status: String!
  subtitle: String
  universe: String
  era: String
  gmSummary: String!
  playerSummary: String!
  durationMinutes: Int
  minPlayers: Int
  maxPlayers: Int
  sourceFilename: String
  sourceHash: String
  importReportJson: String
  runtimeDataVersion: String

  # Skin Engine V1.7
  skinId: String
  accentColor: String
  logoMediaExternalId: String
  backgroundMediaExternalId: String

  # Presentation overrides selected from the reusable organization media library.
  mediaOverridesJson: String

  locked: Boolean! @default(value: false)
  importedAt: Timestamp! @default(expr: "request.time")
}

# ------------------------------------------------------------
# Core narrative model
# Imported entities use a stable externalId inside one version.
# ------------------------------------------------------------

type Character @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  name: String!
  publicRole: String
  dramaticFunction: String
  narrativeAge: String
  gender: String
  importance: String!
  intensity: String!
  biography: String!
  secretIntro: String
  interpretationNotes: String
  appearanceNotes: String
  apparentMotive: String
  personalTimeline: String
  motto: String
  portraitMediaId: String
  portraitArchetypeCode: String
  playable: Boolean! @default(value: true)
  active: Boolean! @default(value: true)
}

type Plot @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  title: String!
  plotType: String!
  importance: String!
  gmSummary: String!
  active: Boolean! @default(value: true)
}

# Character-facing gameplay data persisted from the MASTER workbook.
type Objective @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  ownerType: String!
  ownerExternalId: String!
  title: String!
  description: String!
  objectiveType: String!
  secret: Boolean! @default(value: true)
  initialStatus: String!
  triggerExternalId: String
  importance: String
  active: Boolean! @default(value: true)
}

type Relationship @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  characterAExternalId: String!
  characterBExternalId: String!
  relationType: String
  textA: String!
  textB: String
  visibility: String!
  plotExternalId: String
  active: Boolean! @default(value: true)
}

type Fact @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  title: String!
  text: String!
  nature: String!
  importance: String!
  plotExternalId: String
  notebookCategory: String
  isPublic: Boolean! @default(value: false)
  active: Boolean! @default(value: true)
}

type InitialKnowledge @table(key: ["scenarioVersion", "characterExternalId", "factExternalId"]) {
  scenarioVersion: ScenarioVersion!
  characterExternalId: String!
  factExternalId: String!
  sourceType: String! @default(value: "INITIAL")
}

type Clue @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  internalName: String!
  playerName: String!
  clueType: String!
  playerText: String!
  gmInterpretation: String!
  discoveryHook: String
  plotExternalId: String
  locationExternalId: String
  objectExternalId: String
  documentExternalId: String
  support: String!
  presentationMode: String!
  shareable: Boolean! @default(value: true)
  transferable: Boolean! @default(value: true)
  consumable: Boolean! @default(value: false)
  major: Boolean! @default(value: false)
  logisticsCode: String
  mediaExternalId: String
  addToNotebook: Boolean! @default(value: true)
  active: Boolean! @default(value: true)
}

type ClueFact @table(key: ["scenarioVersion", "clueExternalId", "factExternalId"]) {
  scenarioVersion: ScenarioVersion!
  clueExternalId: String!
  factExternalId: String!
}

type MediaAsset @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  mediaType: String!
  source: String!
  altText: String
  notes: String
  active: Boolean! @default(value: true)
}

# Reusable visual assets shared by every scenario in one organization.
type OrganizationMediaAsset @table(key: ["organization", "externalId"]) {
  organization: Organization!
  externalId: String!
  label: String!
  category: String!
  mediaType: String!
  source: String!
  altText: String
  tags: String
  skinId: String
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type DocumentDefinition @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  title: String!
  textContent: String
  support: String!
  mediaExternalIds: String
  reusable: Boolean! @default(value: true)
  consumable: Boolean! @default(value: false)
  ownerInitialType: String
  ownerInitialExternalId: String
  clueExternalIds: String
  logisticsCode: String
  propRequirementExternalId: String
  transferable: Boolean! @default(value: true)
  stealable: Boolean! @default(value: true)
  active: Boolean! @default(value: true)
}

type GameObject @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  name: String!
  description: String!
  support: String!
  propRequirementExternalId: String
  ownerInitialType: String
  ownerInitialExternalId: String
  logisticsCode: String
  transferable: Boolean! @default(value: true)
  stealable: Boolean! @default(value: false)
  consumable: Boolean! @default(value: false)
  initialCharges: Int
  critical: Boolean! @default(value: false)
  identification0: String
  identification1: String
  identification2: String
  identification3: String
  mediaExternalId: String
  visualArchetypeCode: String
  active: Boolean! @default(value: true)
}

type SkinVisualDefinition @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  skinId: String!
  visualType: String!
  archetypeCode: String!
  mediaExternalId: String!
  displayName: String
  description: String
  variant: String
  active: Boolean! @default(value: true)
}

type Resource @table(key: ["scenarioVersion", "externalId"]) {
  scenarioVersion: ScenarioVersion!
  externalId: String!
  name: String!
  scopeType: String!
  unit: String
  defaultValue: Int
  maxValue: Int

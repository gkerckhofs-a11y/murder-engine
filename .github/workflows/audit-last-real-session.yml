name: Read-only session audit
on:
  push:
    branches: [audit/latest-real-session]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - name: Read and encrypt diagnostic evidence
        env:
          GOOGLE_CLOUD_PROJECT: murder-engine-ludificateur
        run: node functions/tools/audit-last-session.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-session-audit
          path: audit-output/session-audit.encrypted.json
          retention-days: 2

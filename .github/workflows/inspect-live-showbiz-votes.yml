name: Inspect live SHOWBIZ vote dashboard

on:
  push:
    branches:
      - hotfix/register-mabel-press-winner

permissions:
  contents: read

jobs:
  inspect-votes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}

      - name: Verify production project
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "murder-engine-ludificateur" || (echo "Unexpected Firebase project: $FIREBASE_PROJECT_ID" && exit 1)

      - name: Read calculated live vote dashboard only
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { getVoteDashboard } from './src/votes.mjs';

          const sessionId = '14badd025d13488686faa0c9b3dc12dd';
          const dashboard = await getVoteDashboard(sessionId);

          const summary = dashboard.votes.map(vote => ({
            externalId: vote.externalId,
            title: vote.title,
            activeRound: vote.activeRound ? {
              round: vote.activeRound.round,
              status: vote.activeRound.status,
              eligibleOptionExternalIds: vote.activeRound.eligibleOptionExternalIds,
              result: vote.result,
            } : null,
            electorate: vote.electorate,
            voters: vote.voters,
            options: vote.options.map(option => ({
              externalId: option.externalId,
              label: option.label,
              characterExternalId: option.characterExternalId,
            })),
          }));

          console.log('LIVE_VOTE_DASHBOARD_BEGIN');
          console.log(JSON.stringify({
            session: dashboard.session,
            press: summary.find(v => v.externalId === 'VOTE_JURY_PRESS'),
            casting: summary.find(v => v.externalId === 'VOTE_CASTING_FINAL'),
            murder: summary.find(v => v.externalId === 'VOTE_MURDER_ACCUSE'),
          }, null, 2));
          console.log('LIVE_VOTE_DASHBOARD_END');
          NODE

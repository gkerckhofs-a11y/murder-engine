name: Assign transparent Sava portrait
on:
  push:
    branches: [fix/sava-portrait]
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: murder-engine-ludificateur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - run: node --test functions/test/sava-portrait.test.mjs functions/test/relationship-contacts.test.mjs functions/test/player.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - run: node functions/tools/apply-sava-portrait.mjs
      - run: npm install --global firebase-tools@15.34.0
      - run: firebase deploy --project murder-engine-ludificateur --only functions:getPublicPlayerPortal --non-interactive
      - run: node functions/tools/apply-sava-portrait.mjs --verify

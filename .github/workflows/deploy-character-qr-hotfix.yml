name: Deploy character QR hotfix

on:
  push:
    branches:
      - hotfix/character-qr-safe-landing

permissions:
  contents: read

jobs:
  validate-and-deploy-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested hotfix
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Verify character QR routing remains compatible
        run: |
          grep -q '/scan/character/' web/src/PlayerPortal.tsx
          grep -q 'characterFromQr' web/src/QrCharacterScanner.tsx
          grep -q 'CharacterQrLanding' web/src/main.tsx

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify production project
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "murder-engine-ludificateur" || (echo "Unexpected Firebase project: $FIREBASE_PROJECT_ID" && exit 1)

      - name: Deploy Hosting only
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting \
            --non-interactive

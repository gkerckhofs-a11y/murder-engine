name: Apply and verify Mirador character context
on:
  push:
    branches: [ops/nid-character-context]
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCLOUD_PROJECT: murder-engine-ludificateur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - run: node functions/tools/apply-nid-character-context.mjs
      - run: node functions/tools/apply-nid-character-context.mjs --verify

name: Create Latest SHOWBIZ Test Session

on:
  push:
    branches:
      - diagnose/showbiz-latest-test-session
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - name: Create latest SHOWBIZ test session
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/create-latest-showbiz-test-session.mjs
      - name: Check latest SHOWBIZ interactions
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/check-latest-showbiz-interactions.mjs
      - name: Check player portal action eligibility
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/check-latest-showbiz-player-portals.mjs
      - name: Audit SHOWBIZ V1.7.2 action data
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/audit-showbiz-v172-action-data.mjs
      - name: Audit SHOWBIZ rumor runtime
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/audit-showbiz-rumor-runtime.mjs
      - name: Check player source pagination
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/check-player-source-pagination.mjs

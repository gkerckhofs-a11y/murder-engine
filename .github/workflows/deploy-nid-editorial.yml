name: Preserve Nid room illustrations and verify published viewer
on:
  push:
    branches: [fix/nid-editorial]
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: murder-engine-ludificateur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - run: node --test functions/test/nid-room-media.test.mjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - name: Apply guarded correction and verify all sixteen player views
        run: node functions/tools/apply-nid-editorial.mjs
      - name: Verify published viewer revision
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const expected='d80ff0db5ac5f87cfde06cd05d6f8269428df2e9';
          let published;
          for(let i=0;i<12;i++){
            const r=await fetch('https://murder-engine-ludificateur.web.app/deployment-version.json?verify='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
            published=r.ok?await r.json():{status:r.status};
            if(published.revision===expected)break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          writeFileSync('nid-editorial-evidence/published.json',JSON.stringify(published));
          console.log(JSON.stringify(published));
          if(published.revision!==expected)throw Error('DEPLOYMENT_REVISION_MISMATCH');
          JS
      - name: Save scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nid-editorial-evidence
          path: |
            nid-editorial-evidence/
            web/test-results/evidence/
          retention-days: 14

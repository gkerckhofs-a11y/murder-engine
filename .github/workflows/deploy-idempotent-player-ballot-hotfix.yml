name: Deploy idempotent player ballot hotfix

on:
  push:
    branches:
      - hotfix/idempotent-player-ballot

permissions:
  contents: write

jobs:
  validate-and-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[persisted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact live-production hotfix base
        uses: actions/checkout@v4
        with:
          ref: hotfix/idempotent-player-ballot
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Patch ballot writes to be idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          votes_path = Path('functions/src/votes.mjs')
          tests_path = Path('functions/test/votes.test.mjs')

          text = votes_path.read_text()

          helper_old = """const splitIds = value => String(value ?? '').split(';').map(x => x.trim()).filter(Boolean);
          const joinIds = values => (values ?? []).filter(Boolean).join(';');
          const byId = (rows, key='externalId') => new Map((rows ?? []).map(row => [row[key], row]));
          """

          helper_new = """const splitIds = value => String(value ?? '').split(';').map(x => x.trim()).filter(Boolean);
          const joinIds = values => (values ?? []).filter(Boolean).join(';');
          const byId = (rows, key='externalId') => new Map((rows ?? []).map(row => [row[key], row]));
          const normalizedIdSet = values => [...new Set((values ?? []).map(String).filter(Boolean))].sort();
          const sameIdSet = (left, right) => {
            const a=normalizedIdSet(left);
            const b=normalizedIdSet(right);
            return a.length===b.length && a.every((value,index)=>value===b[index]);
          };
          function errorSearchText(error){
            const parts=[error instanceof Error?error.message:String(error??'')];
            if(error&&typeof error==='object'&&'details' in error){
              try{parts.push(JSON.stringify(error.details));}
              catch{parts.push(String(error.details??''));}
            }
            return parts.join(' ');
          }
          function isSessionBallotUniqueConstraint(error){
            const compact=errorSearchText(error).toLowerCase().replace(/[^a-z0-9]+/g,'');
            return compact.includes('sessionballotpkey') &&
              (compact.includes('unique')||compact.includes('duplicate')||compact.includes('violatedsql'));
          }
          """

          if helper_new not in text:
            if helper_old not in text:
              raise SystemExit('Expected vote helper block not found; refusing to patch')
            text = text.replace(helper_old, helper_new, 1)

          start = text.find('export async function castSessionBallot')
          end = text.find('\n\nexport async function closeSessionVote', start)
          if start < 0 or end < 0:
            raise SystemExit('castSessionBallot boundaries not found; refusing to patch')

          replacement = r'''export async function castSessionBallot(sessionId,input,{reader=defaultReader,executor=defaultExecutor,now=()=>new Date()}={}) {
            const {session,source,runtime}=await loadVoteState(sessionId,reader);
            if(!['LIVE','PAUSED'].includes(session.status)) throw new Error('BALLOT_REQUIRES_LIVE_SESSION');
            const def=getDefinition(source,String(input.voteExternalId));
            const open=(runtime.sessionVotes??[]).filter(v=>v.voteExternalId===def.externalId&&v.status==='OPEN').sort((a,b)=>b.round-a.round)[0];
            if(!open) throw new Error('VOTE_NOT_OPEN');
            const voter=String(input.electorCharacterExternalId??'').trim();
            const electorate=resolveElectorate(def,session.sessionParticipants_on_gameSession??[],runtime,source);
            if(!electorate.includes(voter)) throw new Error('VOTER_NOT_ELIGIBLE');
            const eligible=new Set(splitIds(open.eligibleOptionExternalIds));
            const selected=Array.isArray(input.selectedOptionExternalIds)?input.selectedOptionExternalIds.map(String).filter(Boolean):splitIds(input.selectedOptionExternalIds);
            if(!selected.length && !def.abstention) throw new Error('ABSTENTION_NOT_ALLOWED');
            if(selected.length>Math.max(1,def.votesPerElector??1)) throw new Error('TOO_MANY_CHOICES');
            if(selected.some(id=>!eligible.has(id))) throw new Error('VOTE_OPTION_NOT_ELIGIBLE');
            let weight=1;
            if(def.weighted&&def.weightResourceExternalId){
              const resource=(runtime.sessionResources??[]).find(r=>r.characterExternalId===voter&&r.resourceExternalId===def.weightResourceExternalId);
              weight=Math.max(0,Number(resource?.currentValue??0));
            }

            const ballotKeyMatches=ballot=>
              ballot.voteExternalId===def.externalId &&
              ballot.round===open.round &&
              ballot.electorCharacterExternalId===voter;
            const previous=(runtime.sessionBallots??[]).find(ballotKeyMatches);
            const stamp=now().toISOString();
            const selectedOptionExternalIds=joinIds(selected);
            const response=(updated=false,alreadyRecorded=false)=>({
              voteExternalId:def.externalId,
              round:open.round,
              electorCharacterExternalId:voter,
              updated,
              alreadyRecorded,
            });

            if(previous){
              if(sameIdSet(splitIds(previous.selectedOptionExternalIds),selected))
                return response(false,true);
              if(!def.modifiable) throw new Error('BALLOT_NOT_MODIFIABLE');
              await executor(UPDATE_BALLOT,{sessionId,voteExternalId:def.externalId,round:open.round,electorCharacterExternalId:voter,selectedOptionExternalIds,weight,updatedAt:stamp});
              await executor(INSERT_ACTION_LOG,{data:{gameSessionId:sessionId,actionType:'BALLOT_CAST',characterExternalId:voter,refExternalId:def.externalId,afterValue:def.secret?'SECRET':selectedOptionExternalIds,note:`Tour ${open.round}`}});
              return response(true,false);
            }

            try{
              await executor(INSERT_BALLOT,{data:{gameSessionId:sessionId,voteExternalId:def.externalId,round:open.round,electorCharacterExternalId:voter,selectedOptionExternalIds,weight,castAt:stamp,updatedAt:stamp}});
            }catch(error){
              if(!isSessionBallotUniqueConstraint(error)) throw error;

              // A double tap, retry, or concurrent request may insert the same
              // primary key between our read and write. Re-read once and make
              // that retry idempotent instead of exposing the SQL constraint.
              const refreshed=await loadVoteState(sessionId,reader);
              const current=(refreshed.runtime.sessionBallots??[]).find(ballotKeyMatches);
              if(!current) throw error;

              if(sameIdSet(splitIds(current.selectedOptionExternalIds),selected))
                return response(false,true);

              if(!def.modifiable) throw new Error('BALLOT_NOT_MODIFIABLE');

              await executor(UPDATE_BALLOT,{sessionId,voteExternalId:def.externalId,round:open.round,electorCharacterExternalId:voter,selectedOptionExternalIds,weight,updatedAt:stamp});
              await executor(INSERT_ACTION_LOG,{data:{gameSessionId:sessionId,actionType:'BALLOT_CAST',characterExternalId:voter,refExternalId:def.externalId,afterValue:def.secret?'SECRET':selectedOptionExternalIds,note:`Tour ${open.round}`}});
              return response(true,false);
            }

            await executor(INSERT_ACTION_LOG,{data:{gameSessionId:sessionId,actionType:'BALLOT_CAST',characterExternalId:voter,refExternalId:def.externalId,afterValue:def.secret?'SECRET':selectedOptionExternalIds,note:`Tour ${open.round}`}});
            return response(false,false);
          }'''

          text = text[:start] + replacement + text[end:]
          votes_path.write_text(text)

          tests = tests_path.read_text()
          marker = "same non-modifiable ballot retry is idempotent"
          if marker not in tests:
            tests += r'''

          test('same non-modifiable ballot retry is idempotent',async()=>{
            const rt=runtime();
            rt.sessionVotes=[{voteExternalId:'VOTE_1',round:1,status:'OPEN',eligibleOptionExternalIds:'OPT_A;OPT_B;OPT_C'}];
            rt.sessionBallots=[{voteExternalId:'VOTE_1',round:1,electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:'OPT_A',weight:1}];
            const writes=[];
            const out=await castSessionBallot('S1',{voteExternalId:'VOTE_1',electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:['OPT_A']},{
              reader:readerFor(session(),source(),rt),
              executor:async(op,vars)=>{writes.push({op,vars});return{};}
            });
            assert.equal(out.alreadyRecorded,true);
            assert.equal(out.updated,false);
            assert.equal(writes.length,0);
          });

          test('session ballot primary-key race is an idempotent successful retry',async()=>{
            const first=runtime();
            first.sessionVotes=[{voteExternalId:'VOTE_1',round:1,status:'OPEN',eligibleOptionExternalIds:'OPT_A;OPT_B;OPT_C'}];
            const refreshed=runtime();
            refreshed.sessionVotes=[...first.sessionVotes];
            refreshed.sessionBallots=[{voteExternalId:'VOTE_1',round:1,electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:'OPT_A',weight:1}];
            let runtimeReads=0;
            const reader=async operation=>{
              if(operation.includes('VoteSession'))return {gameSession:session()};
              if(operation.includes('VoteSource'))return source();
              if(operation.includes('VoteRuntime'))return ++runtimeReads===1?first:refreshed;
              throw new Error('UNEXPECTED_READ');
            };
            const writes=[];
            const executor=async(op,vars)=>{
              writes.push({op,vars});
              if(op.includes('InsertBallot')){
                const error=new Error('DATACONNECT_VOTE_WRITE_FAILED');
                error.details=[{message:'violated SQL unique constrain: session ballot pkey'}];
                throw error;
              }
              return{};
            };
            const out=await castSessionBallot('S1',{voteExternalId:'VOTE_1',electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:['OPT_A']},{reader,executor});
            assert.equal(out.alreadyRecorded,true);
            assert.equal(out.updated,false);
            assert.equal(writes.length,1);
            assert.match(writes[0].op,/InsertBallot/);
          });

          test('session ballot primary-key race does not overwrite a different non-modifiable choice',async()=>{
            const first=runtime();
            first.sessionVotes=[{voteExternalId:'VOTE_1',round:1,status:'OPEN',eligibleOptionExternalIds:'OPT_A;OPT_B;OPT_C'}];
            const refreshed=runtime();
            refreshed.sessionVotes=[...first.sessionVotes];
            refreshed.sessionBallots=[{voteExternalId:'VOTE_1',round:1,electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:'OPT_B',weight:1}];
            let runtimeReads=0;
            const reader=async operation=>{
              if(operation.includes('VoteSession'))return {gameSession:session()};
              if(operation.includes('VoteSource'))return source();
              if(operation.includes('VoteRuntime'))return ++runtimeReads===1?first:refreshed;
              throw new Error('UNEXPECTED_READ');
            };
            const executor=async op=>{
              if(op.includes('InsertBallot')){
                const error=new Error('DATACONNECT_VOTE_WRITE_FAILED');
                error.details=[{message:'duplicate key value violates unique constraint session_ballot_pkey'}];
                throw error;
              }
              return{};
            };
            await assert.rejects(
              ()=>castSessionBallot('S1',{voteExternalId:'VOTE_1',electorCharacterExternalId:'CHAR_A',selectedOptionExternalIds:['OPT_A']},{reader,executor}),
              /BALLOT_NOT_MODIFIABLE/
            );
          });
          '''
            tests_path.write_text(tests)
          PY

      - name: Syntax check vote module
        working-directory: functions
        run: node --check src/votes.mjs

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run complete Functions test suite
        working-directory: functions
        run: npm test

      - name: Verify hotfix scope and regression markers
        run: |
          git diff --check
          grep -q "isSessionBallotUniqueConstraint" functions/src/votes.mjs
          grep -q "same non-modifiable ballot retry is idempotent" functions/test/votes.test.mjs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "functions/src/votes.mjs functions/test/votes.test.mjs "

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify production project
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "murder-engine-ludificateur" || (echo "Unexpected Firebase project: $FIREBASE_PROJECT_ID" && exit 1)

      - name: Deploy only the public player vote Function
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:castPublicPlayerVote \
            --non-interactive

      - name: Persist tested source fix
        run: |
          git config user.name "gkerckhofs-a11y"
          git config user.email "gkerckhofs@gmail.com"
          git add functions/src/votes.mjs functions/test/votes.test.mjs
          git commit -m "Make player ballot submission idempotent [persisted]"
          git push origin HEAD:hotfix/idempotent-player-ballot

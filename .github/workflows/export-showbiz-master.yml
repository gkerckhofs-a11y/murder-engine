name: Export SHOWBIZ Master Data

on:
  push:
    branches:
      - diagnose/showbiz-master-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - name: Export SHOWBIZ data
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: node functions/tools/export-showbiz-master-data.mjs
      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: showbiz-master-export
          path: showbiz-master-export.json
          if-no-files-found: error
          retention-days: 3

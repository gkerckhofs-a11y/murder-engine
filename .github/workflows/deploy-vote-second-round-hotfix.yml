name: Deploy second-round vote hotfix

on:
  push:
    branches:
      - hotfix/vote-second-round-live

permissions:
  contents: write

jobs:
  validate-patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact live-production base
        uses: actions/checkout@v4
        with:
          ref: hotfix/vote-second-round-live
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Patch only the player vote state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/PlayerPortal.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """  const [confirmation,setConfirmation]=useState<{title:string;body:string}|null>(null);\n\n  async function submitVote(v:any){""",
          """  const [confirmation,setConfirmation]=useState<{title:string;body:string}|null>(null);\n\n  function voteChoiceKey(v:any){\n    return `${v.externalId}:${v.round}`;\n  }\n\n  function currentChoice(v:any){\n    const eligible=new Set(\n      (v.options??[]).map((o:any)=>String(o.externalId))\n    );\n\n    const local=choice[voteChoiceKey(v)];\n\n    if(local&&eligible.has(local))\n      return local;\n\n    return (v.selectedOptionExternalIds??[])\n      .map(String)\n      .find((id:string)=>eligible.has(id))\n      ??'';\n  }\n\n  async function submitVote(v:any){""",
          'insert round-aware vote helpers'
          )

          replace_once(
          """    const selected=\n      choice[v.externalId]\n      ||v.selectedOptionExternalIds?.[0];\n\n    if(!selected)return;""",
          """    const selected=currentChoice(v);\n\n    if(!selected)return;""",
          'use current round selection when submitting'
          )

          replace_once(
          """                    checked={\n                      (\n                        choice[v.externalId]\n                        ||v.selectedOptionExternalIds?.[0]\n                      )===o.externalId\n                    }""",
          """                    checked={currentChoice(v)===o.externalId}""",
          'render only a valid current-round selection'
          )

          replace_once(
          """                        [v.externalId]:o.externalId""",
          """                        [voteChoiceKey(v)]:o.externalId""",
          'store choices per vote round'
          )

          replace_once(
          """                ||(\n                  !choice[v.externalId]\n                  &&!v.selectedOptionExternalIds?.length\n                )""",
          """                ||!currentChoice(v)""",
          'disable voting until a current-round candidate is selected'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Regression assertions for the press second round
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('web/src/PlayerPortal.tsx').read_text(encoding='utf-8')
          start = text.index('function PlayerVotes(')
          end = text.index('\nfunction PlayerNews(', start)
          block = text[start:end]

          required = [
              'return `${v.externalId}:${v.round}`;',
              'const selected=currentChoice(v);',
              'checked={currentChoice(v)===o.externalId}',
              '[voteChoiceKey(v)]:o.externalId',
              '||!currentChoice(v)',
          ]
          for item in required:
              if item not in block:
                  raise SystemExit(f'Missing regression guard: {item}')

          if 'choice[v.externalId]' in block:
              raise SystemExit('Stale cross-round vote state is still present')

          def current_choice(local, previous, eligible, vote_id, round_number):
              valid = set(eligible)
              value = local.get(f'{vote_id}:{round_number}', '')
              if value in valid:
                  return value
              return next((x for x in previous if x in valid), '')

          assert current_choice({'PRESS:1':'C'}, [], ['A','B'], 'PRESS', 2) == ''
          assert current_choice({'PRESS:1':'C','PRESS:2':'B'}, [], ['A','B'], 'PRESS', 2) == 'B'
          assert current_choice({}, ['C'], ['A','B'], 'PRESS', 2) == ''
          assert current_choice({}, ['A'], ['A','B'], 'PRESS', 2) == 'A'
          print('Second-round regression checks passed')
          PY

      - name: Verify the QR hotfix and in-app scanner are preserved
        run: |
          test -f web/src/CharacterQrLanding.tsx
          grep -q 'CharacterQrLanding' web/src/main.tsx
          grep -q 'characterFromQr' web/src/QrCharacterScanner.tsx
          grep -q '/scan/character/' web/src/PlayerPortal.tsx

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Build production Web app
        working-directory: web
        run: npm run build

      - name: Verify patch scope
        run: |
          git diff --check
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "web/src/PlayerPortal.tsx" || (echo "Unexpected changed files:" && echo "$CHANGED" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify production project
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "murder-engine-ludificateur" || (echo "Unexpected Firebase project: $FIREBASE_PROJECT_ID" && exit 1)

      - name: Deploy Hosting only
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting \
            --non-interactive

      - name: Persist the tested source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/PlayerPortal.tsx
          git commit -m "Fix player vote state between rounds [skip ci]"
          git push origin HEAD:hotfix/vote-second-round-live

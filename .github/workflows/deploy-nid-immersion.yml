name: Publish Nid d’espions immersion corrections
on:
  push:
    branches: [fix/nid-immersion]
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: murder-engine-ludificateur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - run: npm ci --prefix web
      - run: node --test functions/test/player.test.mjs functions/test/relationship-contacts.test.mjs functions/test/sava-portrait.test.mjs
      - run: npm run build --prefix web
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MURDER_ENGINE }}
      - run: node functions/tools/apply-nid-immersion.mjs
      - run: npm install --global firebase-tools@15.34.0
      - run: |
          node -e "require('fs').writeFileSync('web/dist/deployment-version.json',JSON.stringify({revision:process.env.GITHUB_SHA,feature:'nid-immersion'}))"
          firebase deploy --project murder-engine-ludificateur --only functions:getPublicPlayerPortal,hosting --non-interactive
      - run: node functions/tools/apply-nid-immersion.mjs --verify
